<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Cita</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success {
      display: none;
      animation: slideIn 0.5s ease-out;
    }

    .error {
      display: none;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #27ae60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .error-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #e74c3c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .details {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .details-label {
      color: #666;
      font-weight: 500;
    }

    .details-value {
      color: #333;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .button:hover {
      background: #5568d3;
    }

    .error .button {
      background: #e74c3c;
    }

    .error .button:hover {
      background: #c0392b;
    }

    .message-box {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ESTADO: CARGANDO -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Procesando tu confirmación...</p>
    </div>

    <!-- ESTADO: ÉXITO -->
    <div class="success" id="success">
      <div class="success-icon">✓</div>
      <h1>¡Cita Confirmada!</h1>
      <p>Tu reserva ha sido confirmada exitosamente.</p>

      <div class="details" id="successDetails">
        <!-- Se llena dinámicamente -->
      </div>

      <p style="margin-top: 20px; color: #27ae60; font-weight: bold;">
        Te esperamos en la fecha y hora indicada.
      </p>

      <button class="button" onclick="window.location.href='/'">Volver al inicio</button>
    </div>

    <!-- ESTADO: ERROR -->
    <div class="error" id="error">
      <div class="error-icon">✗</div>
      <h1>Error en la Confirmación</h1>
      <p id="errorMessage"></p>

      <div class="message-box warning" id="errorDetails" style="display: none;"></div>

      <button class="button" onclick="window.location.href='/'">Volver al inicio</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cqsgilldrbbigkuxjgnj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_k6gNs3jVdHzQn_eBbMzqVg_ANwgYtuN';

    async function confirmarCita() {
      // Obtener token del query string
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        mostrarError('Token no proporcionado', 'El enlace de confirmación es inválido.');
        return;
      }

      try {
        // Llamar RPC para confirmar cita
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/confirmar_cita_por_token`,
          {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ p_token: token }),
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data || data.length === 0) {
          mostrarError(
            'Error desconocido',
            'No se pudo procesar tu confirmación. Por favor, intenta de nuevo.'
          );
          return;
        }

        const result = data[0];

        if (!result.exito) {
          // Manejo de diferentes errores
          let detalles = '';

          if (result.mensaje && result.mensaje.includes('expiró')) {
            detalles = 'El enlace de confirmación ha expirado. Deberás hacer una nueva reserva.';
          } else if (result.mensaje && result.mensaje.includes('utilizado')) {
            detalles = 'Este enlace ya fue utilizado anteriormente.';
          }

          mostrarError(result.mensaje || 'Error desconocido', detalles);
          return;
        }

        // Éxito: obtener datos de la cita (la RPC retorna columna id_cita)
        const idCita = result.id_cita || result.cita_id;
        obtenerDetallesCita(idCita);
      } catch (error) {
        console.error('Error:', error);
        mostrarError(
          'Error de conexión',
          'No pudimos procesar tu confirmación. Por favor, intenta de nuevo más tarde.'
        );
      }
    }

    async function obtenerDetallesCita(idCita) {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/v_cola_walkins?id_cita=eq.${idCita}&select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
            },
          }
        );

        if (!response.ok) throw new Error('No se pudieron cargar los detalles');

        const data = await response.json();
        if (data && data.length > 0) {
          const cita = data[0];
          mostrarExito(cita);
        } else {
          mostrarExito(null);
        }
      } catch (error) {
        console.error('Error obteniendo detalles:', error);
        // Mostrar éxito sin detalles
        mostrarExito(null);
      }
    }

    function mostrarExito(cita) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('success').style.display = 'block';

      if (cita) {
        const detallesHtml = `
          <div class="details-row">
            <span class="details-label">Cliente:</span>
            <span class="details-value">${cita.nombre_walkin || cita.cliente_nombre || 'Cliente'}</span>
          </div>
          <div class="details-row">
            <span class="details-label">Barbero:</span>
            <span class="details-value">${cita.barbero_nombre || 'Por asignar'}</span>
          </div>
          <div class="details-row">
            <span class="details-label">Servicio:</span>
            <span class="details-value">${cita.servicio_nombre || 'N/A'}</span>
          </div>
          <div class="details-row">
            <span class="details-label">Posición en cola:</span>
            <span class="details-value">#${cita.posicion_cola || 1}</span>
          </div>
        `;
        document.getElementById('successDetails').innerHTML = detallesHtml;
      }
    }

    function mostrarError(titulo, detalles) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'none';
      document.getElementById('error').style.display = 'block';

      document.getElementById('error').querySelector('h1').textContent = titulo;
      document.getElementById('errorMessage').textContent = detalles;

      if (detalles) {
        const errorDetailsEl = document.getElementById('errorDetails');
        errorDetailsEl.textContent = detalles;
        errorDetailsEl.style.display = 'block';
      }
    }

    // Ejecutar confirmación cuando carga la página
    document.addEventListener('DOMContentLoaded', confirmarCita);
  </script>
</body>
</html>
